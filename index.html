<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RizkyTools | Checker Console</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
:root {
    --bg: #07070c;
    --panel: rgba(19, 19, 26, 0.85);
    --border: #2a2a3a;
    --accent: #a855f7;
    --accent2: #ff1744;
    --cyan: #00e5ff;
    --text: #e0e0e0;
    --muted: #666;
}
body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow-x: hidden;
}
body::before {
    content: '';
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle at 20% 20%, rgba(168,85,247,0.08), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0,229,255,0.06), transparent 40%);
    animation: drift 20s ease-in-out infinite alternate;
    z-index: -1;
}
@keyframes drift { from { transform: translate(0,0); } to { transform: translate(40px, 40px); } }

.console {
    width: 960px;
    max-width: 100%;
    background: var(--panel);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 20px;
    border: 1px solid var(--border);
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(168,85,247,0.06) inset;
    animation: fadeIn 0.6s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--accent), var(--cyan));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; color: #000; font-size: 16px;
    box-shadow: 0 0 24px rgba(168,85,247,0.5);
    letter-spacing: -1px;
}
.brand h1 { font-size: 18px; color: #fff; letter-spacing: 1.5px; }
.brand small { display: block; font-size: 11px; color: var(--muted); letter-spacing: 2px; margin-top: 2px; }
.status { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); letter-spacing: 1px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #00c853; box-shadow: 0 0 10px #00c853; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.stat { background: rgba(28,28,38,0.5); border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; transition: border-color 0.2s; }
.stat:hover { border-color: rgba(168,85,247,0.4); }
.stat .num { font-size: 22px; font-weight: 700; color: var(--accent); }
.stat .lbl { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; }

.tabs { display: flex; gap: 8px; margin-bottom: 25px; flex-wrap: wrap; }
.tab { padding: 10px 18px; background: rgba(28,28,38,0.6); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; font-size: 13px; color: #999; transition: all 0.25s; user-select: none; }
.tab:hover { color: var(--accent); border-color: rgba(168,85,247,0.4); }
.tab.active { background: rgba(168,85,247,0.12); border-color: var(--accent); color: var(--accent); box-shadow: 0 0 15px rgba(168,85,247,0.25); }
.panel { display: none; animation: slideIn 0.35s ease; }
.panel.active { display: block; }
@keyframes slideIn { from { opacity: 0; transform: translateX(6px); } to { opacity: 1; transform: none; } }

label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1.5px; }
textarea, input[type="text"], input[type="number"] { width: 100%; background: rgba(10,10,15,0.8); border: 1px solid var(--border); border-radius: 10px; padding: 14px; color: var(--text); font-family: 'Consolas', monospace; font-size: 13px; resize: vertical; outline: none; margin-bottom: 12px; transition: border-color 0.2s, box-shadow 0.2s; }
textarea:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(168,85,247,0.12); }
.btn-group { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
button { padding: 12px 22px; border: none; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s; letter-spacing: 0.3px; }
.btn-primary { background: linear-gradient(135deg, var(--accent), var(--cyan)); color: #000; box-shadow: 0 4px 20px rgba(168,85,247,0.35); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(168,85,247,0.55); }
.btn-secondary { background: rgba(42,42,58,0.8); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: rgba(58,58,74,0.9); }
.btn-warn { background: linear-gradient(135deg, var(--accent2), #aa0022); color: #fff; box-shadow: 0 4px 20px rgba(255,23,68,0.3); }
.btn-warn:hover { transform: translateY(-1px); }
.btn-success { background: linear-gradient(135deg, #00c853, #008833); color: #fff; box-shadow: 0 4px 20px rgba(0,200,83,0.3); }
.btn-success:hover { transform: translateY(-1px); }

.result { margin-top: 15px; padding: 16px; background: rgba(10,10,15,0.9); border: 1px solid var(--border); border-radius: 10px; font-family: 'Consolas', monospace; font-size: 12px; white-space: pre-wrap; display: none; max-height: 420px; overflow-y: auto; line-height: 1.6; }
.result.valid { border-color: #00c853; color: #00e676; box-shadow: 0 0 20px rgba(0,200,83,0.15); }
.result.invalid { border-color: var(--accent2); color: #ff5252; box-shadow: 0 0 20px rgba(255,23,68,0.15); }
.result.warn { border-color: #ff9100; color: #ffab40; }
.result::-webkit-scrollbar { width: 6px; }
.result::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.tax-inputs { display: flex; gap: 10px; align-items: flex-end; margin-top: 10px; flex-wrap: wrap; }
.tax-inputs input { flex: 1; min-width: 140px; margin-bottom: 0; }
.tax-inputs select { width: 180px; padding: 14px; background: rgba(10,10,15,0.8); border: 1px solid var(--border); border-radius: 10px; color: var(--text); outline: none; }

.toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
.toast { background: rgba(19,19,26,0.95); border: 1px solid var(--accent); border-radius: 10px; padding: 14px 20px; color: var(--text); font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: toastIn 0.3s ease; max-width: 320px; }
.toast.error { border-color: var(--accent2); }
@keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }

.footer { text-align: center; margin-top: 20px; font-size: 11px; color: #444; letter-spacing: 1.5px; }
.footer span { color: var(--accent); }

@media (max-width: 700px) {
    .console { padding: 20px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .tab { padding: 8px 14px; font-size: 12px; }
}
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="console">
    <div class="header">
        <div class="brand">
            <div class="logo">RZ</div>
            <div>
                <h1>RIZKYTOOLS</h1>
                <small>v2.5 · LIVE TELEMETRY</small>
            </div>
        </div>
        <div class="status"><div class="dot"></div><span>CONNECTED</span></div>
    </div>

    <div class="stats">
        <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Checked</div></div>
        <div class="stat"><div class="num" id="statValid" style="color:#00e676">0</div><div class="lbl">Valid</div></div>
        <div class="stat"><div class="num" id="statInvalid" style="color:#ff5252">0</div><div class="lbl">Invalid</div></div>
        <div class="stat"><div class="num" id="statPremium" style="color:#ffab40">0</div><div class="lbl">Premium</div></div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('checker', this)">Checker</div>
        <div class="tab" onclick="switchTab('mass', this)">Mass Checker</div>
        <div class="tab" onclick="switchTab('group', this)">Grup</div>
        <div class="tab" onclick="switchTab('refresh', this)">Refresh</div>
        <div class="tab" onclick="switchTab('tax', this)">Tax</div>
        <div class="tab" onclick="switchTab('lookup', this)">Lookup</div>
        <div class="tab" onclick="switchTab('bypass', this)">Bypass</div>
    </div>

    <div id="panel-checker" class="panel active">
        <label>.ROBLOSECURITY COOKIE</label>
        <textarea id="cookieInput" rows="4" placeholder="Paste cookie _|WARNING:-DO-NOT-SHARE..."></textarea>
        <div class="btn-group">
            <button class="btn-primary" onclick="checkCookie()">Refresh & Check</button>
            <button class="btn-secondary" onclick="clearResults()">Clear</button>
        </div>
        <div id="checkerResult" class="result"></div>
    </div>

    <div id="panel-mass" class="panel">
        <label>MASS CHECKER (1 cookie per baris, max 30)</label>
        <textarea id="massInput" rows="6" placeholder="cookie1&#10;cookie2&#10;cookie3..."></textarea>
        <div class="btn-group">
            <button class="btn-primary" onclick="massCheck()">Check All</button>
            <button class="btn-success" onclick="exportCSV()">Export CSV</button>
            <button class="btn-secondary" onclick="clearResults()">Clear</button>
        </div>
        <div id="massResult" class="result"></div>
    </div>

    <div id="panel-group" class="panel">
        <label>.ROBLOSECURITY COOKIE</label>
        <textarea id="groupCookie" rows="3" placeholder="Paste cookie..."></textarea>
        <div class="btn-group"><button class="btn-primary" onclick="checkGroups()">Cek Grup</button></div>
        <div id="groupResult" class="result"></div>
    </div>

    <div id="panel-refresh" class="panel">
        <label>.ROBLOSECURITY COOKIE</label>
        <textarea id="refreshCookie" rows="3" placeholder="Paste cookie..."></textarea>
        <div class="btn-group"><button class="btn-primary" onclick="refreshCookie()">Refresh Cookie</button></div>
        <div id="refreshResult" class="result"></div>
    </div>

    <div id="panel-tax" class="panel">
        <label>ROBUX TAX CALCULATOR (30%)</label>
        <div class="tax-inputs">
            <input type="number" id="taxAmount" placeholder="Jumlah Robux" min="1">
            <select id="taxMode">
                <option value="charge">Saya jual (Charge)</option>
                <option value="receive">Saya terima (Receive)</option>
            </select>
            <button class="btn-primary" onclick="calcTax()">Hitung</button>
        </div>
        <div id="taxResult" class="result"></div>
    </div>

    <div id="panel-lookup" class="panel">
        <label>LOOKUP USERNAME</label>
        <input type="text" id="lookupName" placeholder="Masukkan username Roblox...">
        <div class="btn-group"><button class="btn-primary" onclick="lookupUser()">Lookup</button></div>
        <div id="lookupResult" class="result"></div>
    </div>

    <div id="panel-bypass" class="panel">
        <label>BYPASS IP LOCK (proxy via env PROXY_URL)</label>
        <textarea id="bypassCookie" rows="3" placeholder="Paste cookie..."></textarea>
        <input type="text" id="bypassTarget" placeholder="Target URL (opsional)" value="https://users.roblox.com/v1/users/authenticated">
        <div class="btn-group"><button class="btn-warn" onclick="bypassCheck()">Coba Bypass</button></div>
        <div id="bypassResult" class="result"></div>
    </div>
</div>

<div class="footer">RIZKYTOOLS · v2.5 · Built for <span>Rizky</span></div>

<script>
const API_BASE = '/api'; // Pakai endpoint Netlify redirect
let massData = [];

function switchTab(name, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    document.getElementById(`panel-${name}`).classList.add('active');
}
function clearResults() {
    document.querySelectorAll('.result').forEach(r => { r.style.display = 'none'; r.textContent = ''; });
    toast('Cleared', 'error');
}
function show(el, cls, text) { el.style.display = 'block'; el.className = 'result ' + (cls || ''); el.textContent = text; }
function toast(msg, type) {
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = 'toast' + (type === 'error' ? ' error' : '');
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = '0.3s'; setTimeout(() => t.remove(), 300); }, 3000);
}
function updateStats(total, valid, invalid, premium) {
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statValid').textContent = valid;
    document.getElementById('statInvalid').textContent = invalid;
    document.getElementById('statPremium').textContent = premium || 0;
}

async function checkCookie() {
    const cookie = document.getElementById('cookieInput').value.trim();
    const resultDiv = document.getElementById('checkerResult');
    if (!cookie) return toast('Cookie kosong!', 'error');
    show(resultDiv, '', 'Checking... (5-15 detik)');
    try {
        const res = await fetch(`${API_BASE}/check-cookie`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cookie }) });
        const data = await res.json();
        if (data.valid) {
            const u = data.user, t = data.telemetry;
            show(resultDiv, 'valid',
`✅ COOKIE VALID

── ACCOUNT ──
Username     : ${u.name}
Display Name : ${u.displayName}
User ID      : ${u.id}
Created      : ${u.created}
Umur Akun    : ${u.ageDays} hari (~${u.ageYears} tahun)
Banned       : ${u.isBanned ? 'YA' : 'TIDAK'}
Bio          : ${u.description.substring(0, 80)}${u.description.length > 80 ? '...' : ''}

── TELEMETRY ──
Robux        : ${t.robux !== null ? t.robux + ' R$' : 'GAGAL (' + t.robuxError + ')'}
Premium      : ${t.premium ? 'AKTIF ✓' : 'TIDAK'}
RAP (100)    : ${t.rap !== null ? t.rap + ' R$' : 'GAGAL (' + t.rapError + ')'}`);
            updateStats(1, 1, 0, t.premium ? 1 : 0);
            toast('Cookie valid!');
        } else {
            show(resultDiv, 'invalid', `❌ INVALID\n${data.error}`);
            updateStats(1, 0, 1, 0);
            toast('Cookie invalid', 'error');
        }
    } catch (e) { show(resultDiv, 'invalid', '❌ Gagal konek ke backend.'); toast('Backend offline', 'error'); }
}

async function massCheck() {
    const raw = document.getElementById('massInput').value.trim();
    const resultDiv = document.getElementById('massResult');
    if (!raw) return toast('Paste cookie dulu!', 'error');
    const cookies = raw.split('\n').map(c => c.trim()).filter(Boolean);
    if (cookies.length > 30) return toast('Max 30 cookie di Netlify!', 'error');
    show(resultDiv, '', `Checking ${cookies.length} cookies...`);
    try {
        const res = await fetch(`${API_BASE}/mass-check`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cookies }) });
        const data = await res.json();
        if (data.error) return show(resultDiv, 'invalid', `❌ ${data.error}`);
        massData = data.results;
        let out = `📊 HASIL MASS CHECKER\nTotal: ${data.total} | Valid: ${data.validCount} | Invalid: ${data.invalidCount}\n\n── DETAIL ──\n`;
        data.results.forEach((r, i) => {
            if (r.valid) out += `[${i+1}] ✅ ${r.username} (${r.displayName}) | ID:${r.id} | ${r.robux ?? '?'}R$ | ${r.premium ? 'PREMIUM' : 'FREE'} | ${r.ageDays}d\n`;
            else out += `[${i+1}] ❌ INVALID — ${r.error}\n`;
        });
        show(resultDiv, data.validCount > 0 ? 'valid' : 'invalid', out);
        updateStats(data.total, data.validCount, data.invalidCount, data.results.filter(r => r.valid && r.premium).length);
        toast(`${data.validCount} valid, ${data.invalidCount} invalid`);
    } catch (e) { show(resultDiv, 'invalid', '❌ Gagal konek ke backend.'); }
}

function exportCSV() {
    if (massData.length === 0) return toast('Belum ada data!', 'error');
    const rows = [['No', 'Valid', 'Username', 'DisplayName', 'ID', 'Robux', 'Premium', 'AgeDays', 'Error']];
    massData.forEach((r, i) => rows.push([i + 1, r.valid ? 'YES' : 'NO', r.username || '', r.displayName || '', r.id || '', r.robux ?? '', r.premium ? 'YES' : 'NO', r.ageDays || '', r.error || '']));
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `rizkytools_mass_${Date.now()}.csv`;
    a.click();
    toast('CSV exported!');
}

async function checkGroups() {
    const cookie = document.getElementById('groupCookie').value.trim();
    const resultDiv = document.getElementById('groupResult');
    if (!cookie) return toast('Cookie kosong!', 'error');
    show(resultDiv, '', 'Mengambil data grup...');
    try {
        const res = await fetch(`${API_BASE}/group-check`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cookie }) });
        const data = await res.json();
        if (data.error) return show(resultDiv, 'invalid', `❌ ${data.error}`);
        let out = `✅ TOTAL GRUP: ${data.total}\n👑 OWNED: ${data.ownedCount}\n\n`;
        if (data.owned.length > 0) {
            out += `── GRUP YANG DI-OWN ──\n`;
            data.owned.forEach(g => out += `• ${g.name} (ID:${g.id}) | ${g.role} (Rank ${g.rank}) | ${g.memberCount} members\n`);
            out += `\n`;
        }
        if (data.joined.length > 0) {
            out += `── GRUP DI-JOIN (max 30) ──\n`;
            data.joined.slice(0, 30).forEach(g => out += `• ${g.name} — ${g.role} (Rank ${g.rank})\n`);
            if (data.joined.length > 30) out += `... +${data.joined.length - 30} lainnya\n`;
        }
        show(resultDiv, 'valid', out);
        toast('Grup loaded!');
    } catch (e) { show(resultDiv, 'invalid', '❌ Gagal konek ke backend.'); }
}

async function refreshCookie() {
    const cookie = document.getElementById('refreshCookie').value.trim();
    const resultDiv = document.getElementById('refreshResult');
    if (!cookie) return toast('Cookie kosong!', 'error');
    show(resultDiv, '', 'Refreshing...');
    try {
        const res = await fetch(`${API_BASE}/refresh-cookie`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cookie }) });
        const data = await res.json();
        if (data.error) return show(resultDiv, 'invalid', `❌ ${data.error}`);
        let out = `✅ COOKIE REFRESHED\n\nUser: ${data.user.name} (${data.user.displayName})\nID: ${data.user.id}\n\n── NEW COOKIE ──\n${data.newCookie || cookie}\n\n`;
        out += data.sameAsOld ? `⚠️ Cookie sama dengan yang lama.` : `✅ Cookie baru berbeda.`;
        show(resultDiv, 'valid', out);
        toast('Cookie refreshed!');
    } catch (e) { show(resultDiv, 'invalid', '❌ Gagal konek ke backend.'); }
}

async function calcTax() {
    const amount = parseFloat(document.getElementById('taxAmount').value);
    const mode = document.getElementById('taxMode').value;
    const resultDiv = document.getElementById('taxResult');
    if (!amount || amount <= 0) return toast('Jumlah tidak valid!', 'error');
    show(resultDiv, '', 'Menghitung...');
    try {
        const res = await fetch(`${API_BASE}/tax`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ amount, mode }) });
        const data = await res.json();
        show(resultDiv, 'valid', `💰 HASIL\nPrice : ${data.price} R$\nTax   : ${data.tax} R$ (30%)\nNet   : ${data.net} R$`);
    } catch (e) { show(resultDiv, 'invalid', 'Error koneksi.'); }
}

async function lookupUser() {
    const username = document.getElementById('lookupName').value.trim();
    const resultDiv = document.getElementById('lookupResult');
    if (!username) return toast('Masukkan username!', 'error');
    show(resultDiv, '', 'Mencari...');
    try {
        const res = await fetch(`${API_BASE}/lookup`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username }) });
        const data = await res.json();
        if (data.error) return show(resultDiv, 'invalid', `❌ ${data.error}`);
        show(resultDiv, 'valid',
`✅ USER DITEMUKAN

ID        : ${data.id}
Username  : ${data.name}
Display   : ${data.displayName}
Created   : ${data.created}
Umur Akun : ${data.ageDays} hari
Banned    : ${data.isBanned ? 'YA' : 'TIDAK'}
Bio       : ${data.description.substring(0, 120)}${data.description.length > 120 ? '...' : ''}`);
    } catch (e) { show(resultDiv, 'invalid', 'Error lookup.'); }
}

async function bypassCheck() {
    const cookie = document.getElementById('bypassCookie').value.trim();
    const target = document.getElementById('bypassTarget').value.trim();
    const resultDiv = document.getElementById('bypassResult');
    if (!cookie) return toast('Cookie kosong!', 'error');
    show(resultDiv, '', 'Mencoba bypass via proxy...');
    try {
        const res = await fetch(`${API_BASE}/bypass-check`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cookie, target }) });
        const data = await res.json();
        if (data.success) { show(resultDiv, 'valid', `✅ BYPASS BERHASIL\nProxy : ${data.usedProxy}\nStatus: ${data.status}\nData  : ${JSON.stringify(data.data, null, 2)}`); toast('Bypass berhasil!'); }
        else { show(resultDiv, 'invalid', `❌ BYPASS GAGAL\nProxy : ${data.usedProxy}\nError : ${data.error}\nNote  : ${data.hint || '-'}`); toast('Bypass gagal', 'error'); }
    } catch (e) { show(resultDiv, 'invalid', '❌ Gagal konek ke backend.'); }
}
</script>
</body>
</html>
